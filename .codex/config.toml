[agents]
enabled = true
max_concurrent_threads_per_session = 3

[mcp_servers.lazyweb]
command = 'C:\Program Files\Git\bin\sh.exe'
args = ["-lc", 'TOKEN="${LAZYWEB_MCP_TOKEN:-}"; if [ -z "$TOKEN" ] && [ -f "$HOME/.lazyweb/lazyweb_mcp_token" ]; then TOKEN="$(cat "$HOME/.lazyweb/lazyweb_mcp_token")"; fi; exec npx -y mcp-remote https://www.lazyweb.com/mcp --header "Authorization: Bearer $TOKEN" --transport http-first']
