name: familink-staging

services:
  backend:
    image: ${STAGING_BACKEND_IMAGE:?STAGING_BACKEND_IMAGE is required}
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-s15p11b104_staging}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PUSH_ENABLED: "false"
      S3_BUCKET: ${S3_BUCKET:-s15p11b104-media-580779787807-ap-northeast-2-an}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GMS_API_KEY: ${GMS_API_KEY:-}
      GEMINI_DIRECT_MEDIA_ENABLED: ${GEMINI_DIRECT_MEDIA_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_MEDIA_DOWNLOAD_TIMEOUT: ${GEMINI_MEDIA_DOWNLOAD_TIMEOUT:-60s}
      GEMINI_MEDIA_READY_TIMEOUT: ${GEMINI_MEDIA_READY_TIMEOUT:-120s}
      GEMINI_MEDIA_POLL_INTERVAL: ${GEMINI_MEDIA_POLL_INTERVAL:-1s}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m -XX:+UseG1GC}
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s15p11b104_staging}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    expose:
      - "5432"
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-staging-data:/data
    expose:
      - "6379"
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  postgres-staging-data:
  redis-staging-data:
