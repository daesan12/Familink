spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:s15p11b104}}
    username: ${POSTGRES_USER:s15p11b104}
    password: ${POSTGRES_PASSWORD:local_postgres_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local_redis_password}

app:
  auth:
    secret: ${JWT_SECRET:local-development-only-access-token-signing-secret}
  storage:
    s3:
      bucket: ${S3_BUCKET:s15p11b104-media}
      region: ${AWS_REGION:ap-northeast-2}
      endpoint: ${S3_ENDPOINT:}
      presigned-url-duration: ${S3_PRESIGNED_URL_DURATION:10m}
      allowed-hosts: ${S3_ALLOWED_HOSTS:}
