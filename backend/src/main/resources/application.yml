spring:
  application:
    name: backend
  profiles:
    default: local
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gemini:
  request-timeout-ms: ${GEMINI_REQUEST_TIMEOUT_MS:30000}
  analysis:
    api-key: ${GMS_API_KEY:}
    base-url: ${GMS_API_BASE_URL:https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com}
    direct-media-enabled: ${GEMINI_DIRECT_MEDIA_ENABLED:false}
    direct-api-key: ${GEMINI_API_KEY:}
    direct-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    media-download-timeout: ${GEMINI_MEDIA_DOWNLOAD_TIMEOUT:60s}
    media-ready-timeout: ${GEMINI_MEDIA_READY_TIMEOUT:120s}
    media-poll-interval: ${GEMINI_MEDIA_POLL_INTERVAL:1s}
    text-model: ${GEMINI_TEXT_MODEL:gemini-2.5-flash-lite}
    multimodal-model: ${GEMINI_MULTIMODAL_MODEL:gemini-3.5-flash}
  call-report:
    model: ${GEMINI_CALL_REPORT_MODEL:gemini-3.5-flash}
  daily-report:
    model: ${GEMINI_DAILY_REPORT_MODEL:gemini-3.5-flash}

app:
  ai-execution:
    max-concurrency: ${AI_EXECUTOR_MAX_CONCURRENCY:2}
    queue-capacity: ${AI_EXECUTOR_QUEUE_CAPACITY:20}
  auth:
    access-token-validity: 30m
    refresh-token-validity: 14d
  ai-analysis:
    enabled: true
    fixed-delay-ms: 3000
    initial-delay-ms: 3000
  event-reminder:
    fixed-delay-ms: 60000
    initial-delay-ms: 60000
  ai-call-lease:
    lease-duration: 90s
    fixed-delay-ms: 30000
    initial-delay-ms: 30000
  transcript-recovery:
    fixed-delay-ms: 60000
    initial-delay-ms: 60000
    cleanup-delay-ms: 3600000
    cleanup-initial-delay-ms: 3600000
  call-report-generation:
    recovery-delay-ms: 60000
    recovery-initial-delay-ms: 60000
  push:
    enabled: ${PUSH_ENABLED:false}
  media:
    image-max-size-bytes: ${MEDIA_IMAGE_MAX_SIZE_BYTES:10485760}
    video-max-size-bytes: ${MEDIA_VIDEO_MAX_SIZE_BYTES:104857600}
    video-max-duration-seconds: ${MEDIA_VIDEO_MAX_DURATION_SECONDS:60}
    allowed-image-types: ${MEDIA_ALLOWED_IMAGE_TYPES:image/jpeg,image/png,image/webp}
    allowed-video-types: ${MEDIA_ALLOWED_VIDEO_TYPES:video/mp4}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
