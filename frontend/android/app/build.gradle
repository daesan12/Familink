project.ext.envConfigFiles = [
    debug: ".env.development",
    release: ".env.production",
]

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release 서명값 로딩. 우선순위: 환경변수 > frontend/android/keystore.properties.
 * keystore.properties는 git에 커밋하지 않는다 (keystore.properties.example 참고).
 * 값이 없어도 configuration은 통과시키고, 실패는 validateReleaseSigning task가 담당한다.
 */
def releaseKeystorePropsFile = rootProject.file("keystore.properties")
def releaseKeystoreProps = new Properties()
if (releaseKeystorePropsFile.exists()) {
    releaseKeystorePropsFile.withInputStream { releaseKeystoreProps.load(it) }
}
def releaseSigningValue = { String name ->
    def value = System.getenv(name) ?: releaseKeystoreProps.getProperty(name)
    return (value == null || value.trim().isEmpty()) ? null : value.trim()
}
def releaseStoreFilePath = releaseSigningValue("RELEASE_STORE_FILE")
def releaseStorePassword = releaseSigningValue("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = releaseSigningValue("RELEASE_KEY_ALIAS")
def releaseKeyPassword = releaseSigningValue("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.s15p11b104app"
    // Windows에서는 .cxx 아래 vector-icons codegen 경로가 MAX_PATH(260자)를 넘어
    // release 네이티브 빌드가 mkdir 오류로 실패하므로 스테이징 디렉터리를 짧은 경로로 옮긴다.
    if (org.gradle.internal.os.OperatingSystem.current().windows) {
        externalNativeBuild.cmake.buildStagingDirectory = new File("C:/s15cxx")
    }
    defaultConfig {
        applicationId "com.s15p11b104app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        compose true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            signingConfig signingConfigs.release
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

/**
 * S15P11B104-226: release 서명값이 없거나 debug 인증서로 서명하려 하면 release 빌드를 실패시킨다.
 * 실행 시점(doLast) 검사라서 debug 빌드와 IDE sync에는 영향이 없다.
 */
def signingCertificate = { File storeFile, String storePassword, String alias ->
    def keyStore = java.security.KeyStore.getInstance(storeFile, storePassword.toCharArray())
    def cert = keyStore.getCertificate(alias)
    if (cert == null) {
        throw new GradleException("keystore에 alias '${alias}'가 없습니다: ${storeFile}")
    }
    return cert
}
def certSha256 = { cert ->
    java.security.MessageDigest.getInstance("SHA-256").digest(cert.encoded).encodeHex().toString()
}

tasks.register("validateReleaseSigning") {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                "release 서명값이 없습니다. RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, " +
                "RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD를 환경변수 또는 " +
                "frontend/android/keystore.properties로 주입하세요. " +
                "(frontend/android/keystore.properties.example 참고)")
        }
        def releaseStoreFile = rootProject.file(releaseStoreFilePath)
        if (!releaseStoreFile.exists()) {
            throw new GradleException("release keystore 파일이 없습니다: ${releaseStoreFile}")
        }
        def releaseCert = signingCertificate(releaseStoreFile, releaseStorePassword, releaseKeyAlias)
        def subject = ((java.security.cert.X509Certificate) releaseCert).subjectX500Principal.name
        if (subject.contains("CN=Android Debug")) {
            throw new GradleException("release 서명 인증서가 debug 인증서(CN=Android Debug)입니다: ${releaseStoreFile}")
        }
        // debug.keystore가 저장소에서 제거되면 지문 비교는 건너뛴다. CN 검사가 debug 인증서를 계속 차단한다.
        def debugKeystoreFile = file('debug.keystore')
        if (debugKeystoreFile.exists()) {
            def debugCert = signingCertificate(debugKeystoreFile, 'android', 'androiddebugkey')
            if (certSha256(releaseCert) == certSha256(debugCert)) {
                throw new GradleException("release 서명 인증서 지문이 debug.keystore와 동일합니다. 별도 release keystore를 사용하세요.")
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn("validateReleaseSigning")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def composeBom = platform("androidx.compose:compose-bom:2025.06.01")
    implementation(composeBom)
    androidTestImplementation(composeBom)
    implementation("androidx.activity:activity-compose:1.10.1")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-tooling-preview")

    def firebaseBom = platform("com.google.firebase:firebase-bom:34.16.0")
    implementation(firebaseBom)
    implementation("com.google.firebase:firebase-messaging")

    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("io.github.webrtc-sdk:android:144.7559.08")
    debugImplementation("androidx.compose.ui:ui-tooling")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")
    androidTestImplementation("androidx.compose.ui:ui-test-junit4")
    debugImplementation("androidx.compose.ui:ui-test-manifest")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
